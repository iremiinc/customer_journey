    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "welcome_push", "label": "welcome_push\n(push)", "shape": "box", "size": 10}, {"color": "#97c2fc", "id": "wait_delay", "label": "wait_delay\n(wait)", "shape": "box", "size": 10}, {"color": "#97c2fc", "id": "blocked_exit", "label": "blocked_exit\n(exit)", "shape": "box", "size": 10}, {"color": "#97c2fc", "id": "freq_exit", "label": "freq_exit\n(exit)", "shape": "box", "size": 10}, {"color": "#97c2fc", "id": "check_purchase_prop", "label": "check_purchase_prop\n(condition)", "shape": "box", "size": 10}, {"color": "#97c2fc", "id": "offer_email", "label": "offer_email\n(email)", "shape": "box", "size": 10}, {"color": "#97c2fc", "id": "reminder_sms", "label": "reminder_sms\n(sms)", "shape": "box", "size": 10}, {"color": "#97c2fc", "id": "conversion_exit", "label": "conversion_exit\n(exit)", "shape": "box", "size": 10}, {"color": "#97c2fc", "id": "dropoff_exit", "label": "dropoff_exit\n(exit)", "shape": "box", "size": 10}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "welcome_push", "to": "wait_delay", "width": 1}, {"arrows": "to", "from": "welcome_push", "label": "Consent Block", "to": "blocked_exit", "width": 1}, {"arrows": "to", "from": "welcome_push", "label": "Freq Cap Block", "to": "freq_exit", "width": 1}, {"arrows": "to", "from": "wait_delay", "to": "check_purchase_prop", "width": 1}, {"arrows": "to", "from": "check_purchase_prop", "label": "True", "to": "offer_email", "width": 1}, {"arrows": "to", "from": "check_purchase_prop", "label": "False", "to": "reminder_sms", "width": 1}, {"arrows": "to", "from": "offer_email", "to": "conversion_exit", "width": 1}, {"arrows": "to", "from": "offer_email", "label": "Consent Block", "to": "blocked_exit", "width": 1}, {"arrows": "to", "from": "offer_email", "label": "Freq Cap Block", "to": "freq_exit", "width": 1}, {"arrows": "to", "from": "reminder_sms", "to": "dropoff_exit", "width": 1}, {"arrows": "to", "from": "reminder_sms", "label": "Consent Block", "to": "blocked_exit", "width": 1}, {"arrows": "to", "from": "reminder_sms", "label": "Freq Cap Block", "to": "freq_exit", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
